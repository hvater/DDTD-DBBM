[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a-dmpe"
version = "0.1.1"
authors = [
  { name="Hendrik Vater", email="hendrik.vater@uni-siegen.de" },
]
description = "..."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "dmpe>=0.3.1",
]

[project.optional-dependencies]
cuda12 = ["dmpe[cuda12]"]
cuda13 = ["dmpe[cuda13]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/hvater/A-DMPE"
Issues = "https://github.com/hvater/A-DMPE/issues"

[tool.uv.sources]
DMPE = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["admpe"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]